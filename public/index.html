<style>

.kick-troop-progress-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px}.kick-troop-progress{display:block;width:100%;min-width:0;box-sizing:border-box;padding:6px 7px 5px;border:1px solid rgba(59,130,246,.45);border-radius:9px;background:linear-gradient(180deg,rgba(15,38,78,.68),rgba(2,12,30,.78));font-size:8px;line-height:1;box-shadow:inset 0 0 12px rgba(37,99,235,.06)}.kick-troop-progress-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;color:#93c5fd;font-weight:900;letter-spacing:.2px;white-space:nowrap}.kick-troop-progress-head span:first-child{color:#60a5fa}.kick-troop-progress-track{display:block;width:100%;height:7px;min-width:0;border-radius:999px;background:rgba(15,23,42,.95);border:1px solid rgba(59,130,246,.55);box-shadow:inset 0 1px 3px rgba(0,0,0,.55),0 0 8px rgba(37,99,235,.12);overflow:hidden;box-sizing:border-box}.kick-troop-progress-bar{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#1d4ed8 0%,#2563eb 55%,#38bdf8 100%);transition:width .22s ease;box-shadow:0 0 8px rgba(56,189,248,.45)}.kick-troop-progress-bar.has-failure{background:linear-gradient(90deg,#2563eb 0%,#38bdf8 55%,#f59e0b 100%)}.kick-troop-progress-fail{display:block;min-height:8px;margin-top:3px;text-align:right;color:#fb7185;font-size:7px;font-weight:800;white-space:nowrap}@media(max-width:365px){.kick-troop-progress-grid{gap:4px}.kick-troop-progress{padding:5px 5px 4px}.kick-troop-progress-track{height:6px}}

<style id="login-mobile-animation">
/* Login UI - mobile friendly, animated, tanpa mengubah logic */
.login-icon{
  position:relative;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s ease, box-shadow .25s ease, background .25s ease;
}
.login-icon::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.20) 50%,transparent 65%);
  transform:translateX(-70%) rotate(8deg);
  animation:loginShine 3.8s ease-in-out infinite;
  pointer-events:none;
}
.login-icon svg{position:relative;z-index:1}
.login-icon:hover{
  transform:translateY(-1px) scale(1.04);
  box-shadow:0 0 18px rgba(16,185,129,.24);
}
.login-icon:active{transform:scale(.90)}
.troop-card{
  animation:troopIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.troop-card:nth-child(1){animation-delay:.02s}
.troop-card:nth-child(2){animation-delay:.05s}
.troop-card:nth-child(3){animation-delay:.08s}
.troop-card:nth-child(4){animation-delay:.11s}
.troop-card:nth-child(5){animation-delay:.14s}
.troop-card:nth-child(6){animation-delay:.17s}
.troop-card:nth-child(7){animation-delay:.20s}
.troop-card:nth-child(8){animation-delay:.23s}
.troop-card:nth-child(9){animation-delay:.26s}
.troop-card:nth-child(10){animation-delay:.29s}
.troop-input{
  transition:border-color .22s ease,box-shadow .22s ease,transform .18s ease,background .22s ease;
}
.troop-input:focus{
  transform:translateY(-1px);
  background:#ffffff !important;color:#0f172a !important;
  box-shadow:0 0 0 2px rgba(59,130,246,.18),0 8px 20px rgba(0,0,0,.16);
}
.troop-status.online{
  animation:onlinePulse 2.2s ease-in-out infinite;
}
@keyframes troopIn{
  from{opacity:0;transform:translateY(8px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes loginShine{
  0%,55%{transform:translateX(-75%) rotate(8deg)}
  75%,100%{transform:translateX(75%) rotate(8deg)}
}
@keyframes onlinePulse{
  0%,100%{box-shadow:0 0 8px rgba(16,185,129,.10)}
  50%{box-shadow:0 0 14px rgba(16,185,129,.22)}
}
@media(max-width:430px){
  .login-icon{box-shadow:0 0 12px rgba(16,185,129,.12)}
  .troop-card{animation-duration:.38s}
}
@media(prefers-reduced-motion:reduce){
  .troop-card,.login-icon::before,.troop-status.online{
    animation:none!important;
  }
  .login-icon,.troop-input{transition:none!important}
}
</style>


<style id="main-login-animation">
.login-all-button{
  position:relative;
  overflow:hidden;
  transition:transform .18s ease,box-shadow .25s ease,background .25s ease;
}
.login-all-button::after{
  content:"";
  position:absolute;
  top:0;bottom:0;width:45%;
  left:-55%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:skewX(-18deg);
  animation:mainLoginSweep 4.5s ease-in-out infinite;
}
.login-all-button svg,.login-all-button{
  isolation:isolate;
}
.login-all-button:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 26px rgba(16,185,129,.18);
}
.login-all-button:active{transform:scale(.97)}
@keyframes mainLoginSweep{
  0%,55%{left:-55%}
  80%,100%{left:120%}
}
@media(prefers-reduced-motion:reduce){
  .login-all-button::after{animation:none}
}
</style>

width:100%!important;max-width:none!important;

</style>

      </div>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="participants()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95">LIST USER</button>
      <button onclick="balanceAll()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95">REFRESH SALDO</button>
    </div>
  </div>


  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
    
    <!-- Participants Column -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5 flex flex-col">
      <div class="flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-slate-200">List User</h3>
        <div></div>
      </div>
      <div id="participantsList" class="flex-1 min-h-[200px] max-h-[280px] overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 space-y-1.5">
        <div class="flex items-center justify-center h-full text-xs text-slate-500 py-10">Belum ada data user.</div>
      </div>
    </div>

    <!-- Target Kick Column -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5 flex flex-col">
      <div class="flex items-center justify-between gap-2">
        <h3 class="text-sm sm:text-base font-bold text-slate-200">Target Kick</h3>
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] font-medium text-slate-400 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800/80">Daftar Eksekusi</span>
          <button onclick="clearTargets()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 border border-rose-900/40 hover:bg-rose-950/30 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-9 h-9 shrink-0" title="Hapus List Target Kick" aria-label="Hapus List Target Kick">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div id="targetList" class="flex-1 min-h-[200px] max-h-[280px] overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 space-y-1.5">
        <div class="flex items-center justify-center h-full text-xs text-slate-500 py-10">Belum ada target.</div>
      </div>
      <div class="kick-control-row">
        <div class="kick-action-box">
          <button id="kickAllButton" onclick="kickSelectedTargets()" class="w-full h-9 bg-rose-600 hover:bg-rose-500 text-white font-bold px-2 rounded-lg text-[10px] transition-all shadow-md shadow-rose-600/20 active:scale-95">KICK ALL</button>
          <div id="timerValue" class="mt-1 w-full h-6 flex items-center justify-center rounded-lg bg-slate-950/80 border border-slate-800 text-[9px] font-semibold text-slate-400">60000</div>
        </div>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Timer</span>
          <input id="kickTimer" type="number" min="0" step="1" value="1500" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Delay Target</span>
          <input id="textdelay" type="number" min="0" step="1" value="15" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Delay Batch</span>
          <input id="delayBatch" type="number" min="0" step="1" value="25" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Loop</span>
          <input id="textloop" type="number" min="1" step="1" value="5" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Brute</span>
          <select id="burstSize" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500">
            <option value="1">Brute 1</option>
            <option value="2">Brute 2</option>
            <option value="3" selected>Brute 3</option>
            <option value="4">Brute 4</option>
            <option value="5">Brute 5</option>
            <option value="6">Brute 6</option>
            <option value="7">Brute 7</option>
            <option value="8">Brute 8</option>
            <option value="9">Brute 9</option>
            <option value="10">Brute 10</option>
          </select>
        </label>


        <div class="reset-timer-wrap">
          <button onclick="resetTimer()" class="bg-blue-950/40 hover:bg-blue-900/50 text-blue-400 border border-blue-800/50 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-9 h-9 shrink-0" title="Reset Timer" aria-label="Reset Timer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v3l2 1M8.5 5.5 7 4m8.5 1.5L17 4M9 3h6"/></svg>
          </button>
        </div>
      </div>

      <!-- Save Set: moved below Target Kick controls only -->
      <div class="save-set-inline">
        <div class="save-set-inline-title">
          <span class="command-title-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 4h11l3 3v13H5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 4v5h8V4M8 20v-6h8v6"/></svg>
          </span>
          <span>Save Set</span>
        </div>
        <div class="save-load-row save-set-inline-row">
          <input id="setName" class="modern-input command-input save-name-input" value="set1" placeholder="Nama set" autocomplete="off">
          <button id="saveSet" class="command-icon-button save-button" title="Save Set" aria-label="Save Set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          </button>
          <button id="loadSet" class="command-icon-button load-button" title="Load Set" aria-label="Load Set">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v-1a3 3 0 013-3h10a3 3 0 013 3v1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          </button>
        </div>
        <input id="loadSetFile" class="hidden" type="file" accept="application/json,.json">
      </div>
    </div>

  </div>

  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
    <div class="flex items-center justify-between gap-2">
      <h3 class="sr-only">API Event</h3>
    </div>
    
    
    <div id="kickProgress" class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 space-y-2">
      <div class="flex justify-between items-center gap-2 text-[11px] font-semibold">
        <span class="text-slate-300">KICK ALL PROGRESS</span>
        <span id="kickProgressText" class="text-blue-400">Siap</span>
      </div>
      <div class="h-2.5 rounded-full bg-slate-800 overflow-hidden">
        <div id="kickProgressBar" class="h-full w-0 rounded-full bg-gradient-to-r from-blue-500 to-indigo-400 transition-all duration-300"></div>
      </div>
      <div class="flex justify-between gap-2 text-[10px]">
        <span id="kickProgressStep" class="text-slate-400">Target 0/0</span>
      </div>
      <div class="text-[10px] font-semibold text-slate-400 pt-1">PROGRESS TARGET</div>
      <div id="kickTargetProgress" class="grid grid-cols-5 gap-1"></div>
      <div class="kick-troop-progress-grid" id="kickTroopProgressGrid" aria-label="Progress KICK per Troop">
        <div class="kick-troop-progress" id="kickTroopProgress0" data-kick-troop="1"><div class="kick-troop-progress-head"><span>T1</span><span id="kickTroopProgressText0">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar0" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail0" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress1" data-kick-troop="2"><div class="kick-troop-progress-head"><span>T2</span><span id="kickTroopProgressText1">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar1" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail1" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress2" data-kick-troop="3"><div class="kick-troop-progress-head"><span>T3</span><span id="kickTroopProgressText2">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar2" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail2" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress3" data-kick-troop="4"><div class="kick-troop-progress-head"><span>T4</span><span id="kickTroopProgressText3">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar3" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail3" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress4" data-kick-troop="5"><div class="kick-troop-progress-head"><span>T5</span><span id="kickTroopProgressText4">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar4" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail4" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress5" data-kick-troop="6"><div class="kick-troop-progress-head"><span>T6</span><span id="kickTroopProgressText5">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar5" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail5" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress6" data-kick-troop="7"><div class="kick-troop-progress-head"><span>T7</span><span id="kickTroopProgressText6">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar6" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail6" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress7" data-kick-troop="8"><div class="kick-troop-progress-head"><span>T8</span><span id="kickTroopProgressText7">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar7" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail7" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress8" data-kick-troop="9"><div class="kick-troop-progress-head"><span>T9</span><span id="kickTroopProgressText8">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar8" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail8" class="kick-troop-progress-fail"></span></div>
        <div class="kick-troop-progress" id="kickTroopProgress9" data-kick-troop="10"><div class="kick-troop-progress-head"><span>T10</span><span id="kickTroopProgressText9">0/0</span></div><div class="kick-troop-progress-track"><div id="kickTroopProgressBar9" class="kick-troop-progress-bar"></div></div><span id="kickTroopProgressFail9" class="kick-troop-progress-fail"></span></div>
      </div>
      <div id="kickProgressMeta" class="text-[10px] text-slate-500">Menunggu perintah kick...</div>
    </div>
  </div>

</div>

<script src="/frontend.js?v=60"></script>
</body>
</html>
